# Freezing Phantoms - Red Light, Green Light Game Configuration

# Game timing and duration settings
game:
  countdown_duration: 3.0              # Countdown time before game starts (seconds)
  green_light_duration: [5.0, 8.0]     # Green light duration range (min, max) seconds - NOT USED, ends when player advances
  red_light_duration: [3.0, 5.0]       # Red light duration range (min, max) seconds
  penalty_duration: 2.0                 # Penalty display duration (seconds)
  flash_interval: 0.25                  # Interval between flashes during transition (seconds)
  flash_total: 3                        # Number of flashes before red light
  front_tile_wait_duration: 2.0         # Seconds to wait on front tile before transition

# Tile grid configuration (3x6 grid)
tile_grid:
  columns: 3                            # Number of columns in grid
  rows: 6                               # Number of rows in grid
  starting_row: 0                       # Starting position (0 = top, far from camera)
  goal_row: 5                           # Goal position (5 = bottom, last row before UI bar)
  penalty_rows_back: 1                  # Rows to move back on penalty
  path_width: 1                         # Number of safe tiles per row
  obstacle_density: 0.3                 # Percentage of non-path tiles that are red lava (0.0-1.0)
  
# Lives system
lives:
  starting_hearts: 5                    # Number of lives player starts with
  lose_heart_on_movement: true          # Lose heart when moving during red light
  lose_heart_on_lava: false             # Don't lose heart for lava (just move back)

# Lava floor visual settings
lava_floor:
  texture_path: "lava-floor-2.jpg"      # Path to lava texture image
  tile_border_thickness: 2              # Border thickness around tiles (pixels)
  tile_border_color: [50, 50, 50]       # Border color (BGR format)

# Movement detection settings (freeze detection during RED LIGHT)
# Uses velocity-based detection: smooths positions first, then calculates velocity
movement:
  velocity_threshold: 120.0             # Velocity threshold in pixels/second (higher = less sensitive)
                                        # Recommended range: 80-200 px/s
                                        # - 80 px/s: Very sensitive (catches slow movements)
                                        # - 120 px/s: Moderate (default, catches deliberate movements)
                                        # - 150 px/s: Less sensitive (only catches faster movements)
                                        # - 200 px/s: Very forgiving (only quick movements)
  monitored_keypoints:                  # Body parts monitored for movement
    - left_wrist                        # Left hand
    - right_wrist                       # Right hand
    - left_hip                          # Left hip
    - right_hip                         # Right hip
  position_smoothing_alpha: 0.2         # Position smoothing (0-1, lower = more smoothing, reduces noise)
                                        # Lower values filter out measurement noise better
  velocity_window_duration: 0.3         # Time window for velocity calculation (seconds)
                                        # Longer window = more stable, shorter = more responsive
  min_consecutive_frames: 2             # Consecutive frames above threshold required to trigger
                                        # Higher = fewer false positives, lower = more responsive
  keypoint_confidence_threshold: 0.5    # Minimum confidence score for keypoints (0-1)
  fps: 30.0                             # Expected frame rate for velocity calculations

# Camera configuration
camera:
  resolution: [1280, 720]               # Camera resolution (720p, matches calibration)
  fps: 30                                # Frame rate

# Projector configuration
projector:
  resolution: [1280, 720]               # Projector resolution (should match camera)
  display_index: 1                       # Display index (0=primary, 1=secondary)

# Calibration pattern settings
calibration:
  pattern_rows: 6                        # Number of interior corners vertically
  pattern_cols: 9                        # Number of interior corners horizontally
  square_size: 80                        # Size of each checkerboard square (pixels)
