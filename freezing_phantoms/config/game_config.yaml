game:
  countdown_duration: 3.0
  green_light_duration: [5.0, 8.0]  # Random range in seconds
  red_light_duration: [3.0, 5.0]    # Random range in seconds
  penalty_duration: 2.0

movement:
  threshold_pixels: 20.0
  monitored_keypoints:
    - left_wrist
    - right_wrist
    - left_ankle
    - right_ankle
    - left_shoulder
    - right_shoulder
  # Smoothing and sensitivity controls
  smoothing_alpha: 0.3  # 0-1, higher = more responsive, lower = more stable
  pose_history_size: 5  # Number of poses to keep in history for smoothing
  sensitivity_multiplier: 1.0  # >0, higher = more sensitive to movement
  # Confidence filtering
  keypoint_confidence_threshold: 0.5  # 0-1, minimum confidence score for keypoints to use

camera:
  resolution: [1280, 720]
  fps: 30

projector:
  resolution: [1920, 1080]
  display_index: 1  # Secondary display (0 = primary, 1 = secondary)

calibration:
  pattern_rows: 4
  pattern_cols: 5
  circle_radius: 80
  circle_spacing: 300

board:
  width: 1920
  height: 1080
  obstacles:
    - id: "obstacle_1"
      type: "rectangle"
      position: [400, 300]
      size: [200, 150]
      color: [255, 0, 0]
    - id: "obstacle_2"
      type: "circle"
      position: [800, 600]
      size: [100, 0]
      color: [255, 0, 0]
    - id: "obstacle_3"
      type: "rectangle"
      position: [1200, 400]
      size: [150, 200]
      color: [255, 0, 0]
  boundaries:
    - id: "wall_top"
      type: "wall"
      start: [0, 0]
      end: [1920, 0]
      color: [255, 255, 0]
      thickness: 5
    - id: "wall_bottom"
      type: "wall"
      start: [0, 1080]
      end: [1920, 1080]
      color: [255, 255, 0]
      thickness: 5
    - id: "wall_left"
      type: "wall"
      start: [0, 0]
      end: [0, 1080]
      color: [255, 255, 0]
      thickness: 5
    - id: "wall_right"
      type: "wall"
      start: [1920, 0]
      end: [1920, 1080]
      color: [255, 255, 0]
      thickness: 5
    - id: "finish_line"
      type: "finish_line"
      start: [1800, 100]
      end: [1800, 980]
      color: [0, 255, 0]
      thickness: 8
  ghosts:
    - id: "ghost_1"
      type: "patrol"
      start_pos: [100, 100]
      patrol_points: [[100, 100], [500, 100], [500, 500], [100, 500]]
      speed: 50.0
      color: [0, 0, 255]
      size: 30.0
    - id: "ghost_2"
      type: "chase"
      start_pos: [800, 400]
      detection_range: 200.0
      speed: 60.0
      color: [255, 0, 255]
      size: 35.0
    - id: "ghost_3"
      type: "guard"
      start_pos: [1400, 300]
      detection_range: 150.0
      speed: 40.0
      color: [255, 100, 0]
      size: 25.0
  debug:
    show_leg_positions: true
    show_obstacles: true
    show_ghosts: true
    show_collision_zones: false

